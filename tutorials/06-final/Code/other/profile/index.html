<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>

     <header>

     <nav class="navbar">
        <div class="nav-brand"> 
            <a href="../../"><h1>ABI Files</h1></a>
        </div>
        <div class="nav">
            <ul class="nav-menu">
                <li><a href="../../index.html">Case</a></li>
            </ul>
        </div>
     </nav>
    
    </header>


    <main>
             <h2>✮ ⋆ ˚｡ Employee profile Form⋆｡°✩</h2>
          <div id="layout2">
                <video id="webcam" autoplay playssinline></video>
                    <div id="ui-panel">
                     
            <!-- Form section for selecting or entering milk type -->
            <form id="form">

                <!-- Label and text input for custom entry -->
                <label for="custom">Full name:</label>
                <input type="text" id="custom" placeholder="Kylo, Jean, Bbrnes">

                 <!-- Label and text input for custom entry -->
                <label for="custom">Species:</label>
                <input type="text" id="custom" placeholder="Human,Twilek, Toguta,">

                <!--Dropdown, predefined choices -->
                <label for="choice-type">Gender:</label>
                <select id="choice-type">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Yes">Yes</option>
                    <option value="¯\_(ツ)_/¯">Wouldn't you like you know</option>
                </select>

                  <!--Dropdown, predefined choices -->
                <label for="choice-type">Position:</label>
                <select id="choice-type">
                    <option value="">Classified</option>
                    <option value="Agent">Agent</option>
                    <option value="Forensic">Forensic</option>
                    <option value="Eingeneer">Eingeneer</option>
                    
                </select>

                <!-- Button to submit the form and add to list -->
                <button type="submit">Submit</button>
            </form> 

           

         </div>  

          <!-- Carousel section for quick-add images -->
            <section id="carousel-section">
                <h2>Status</h2>
                <div class="carousel-container">
                    <!-- Previous button for carousel navigation -->
                    <button id="prev-btn">&lt;</button>
                    <!-- Carousel images container -->
                    <div class="carousel">
                        <img src="../../assets/S1.gif" alt="On duty" data-item="On duty">
                        <img src="../../assets/b1.png" alt="Medical Leave" data-item="Medical Leave">
                        <img src="../../assets/S1.gif" alt="Dead" data-item="Dead">
                        <img src="../../assets/b1.png" alt="MIA Food" data-item="MIA">
                    </div>
                    <!-- Next button for carousel navigation -->
                    <button id="next-btn">&gt;</button>
                </div>
            </section>
           <!-- Section to display the shopping list -->
            <section id="-list">
                <h2>Incoming Data</h2>
                <ul id="list"></ul>
            </section>
        </div>       
             
        </main>



    <script src="webcam.js"></script>
    </body> 



       

    <footer class="flex-container">

</html>
