<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Employee Form </title>
    <link rel="stylesheet" href="../../style.css">
</head>


<body>

     <header>

     <nav class="navbar">
        <div class="nav-brand"> 
            <a href="../../"><h1>ABA Employee Profile</h1></a>
        </div>
        <div class="nav">
            <ul class="nav-menu">
                <li><a href="../../index.html">Case</a></li>
            </ul>
        </div>
     </nav>
    
    </header>


    <main>
             
          <div id="layout2">
                <video id="webcam" autoplay playssinline></video>
            
                <div id="ui-panel">
                <button onclick="LoginQuestions()">Update Info</button>
                <div id="output" ></div>

        <script>

            function LoginQuestions() {
             const name = prompt("Full name:");
             const species = prompt("Species:");
             const position = prompt("Current Job: ");
             const outputDiv = document.getElementById("output");

             outputDiv.innerHTML = `
             <h3> ABI employee:</h3>
             <p><strong>Name:</strong> ${name}</p>
             <p><strong>Species:</strong> ${species}</p>
             <p><strong>Position:</strong> ${position}</p>
             `;
            }
        </script>
                     
        

         </div>  

          <!-- Carousel section -->
            <section id="carousel-section">
                <h2>Aditional info:</h2>
                <div class="carousel-container">
                
                    <!-- Images container -->
                    <div class="carousel">
                     <img src="../../assets/S1.gif" alt="Dead">
                     <img src="../../assets/S2.gif" alt="Medical Leave" >
                     <img src="../../assets/S3.gif" alt="Ready top deploy" >
                    </div>
                </div>

            </section>
              <h2>Clearance Level: ᯓ★ </h2>
    
           
        </div>       
        </main>

    <script src="webcam.js"></script>
    </body> 

    <footer class="flex-container">
        <p> &copy; ABI</p>
    </footer>

</html>
