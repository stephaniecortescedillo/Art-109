<!DOCTYPE html>
<html>
<head>
  <title>Connect the Dots</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    canvas {
      background: white;
      border: 2px solid black;
    }
  </style>
</head>
<body>

<canvas id="game" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Square dots
const dots = [
  { x: 100, y: 100 },
  { x: 300, y: 100 },
  { x: 300, y: 300 },
  { x: 100, y: 300 }
];

let currentDot = 0;

// Draw all dots
function drawDots() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let dot of dots) {
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
  }
}

// Draw connected lines
function drawLines(upTo) {
  ctx.beginPath();

  ctx.moveTo(dots[0].x, dots[0].y);

  for (let i = 1; i <= upTo; i++) {
    ctx.lineTo(dots[i].x, dots[i].y);
  }

  ctx.strokeStyle = "blue";
  ctx.lineWidth = 3;
  ctx.stroke();
}

drawDots();

// Handle clicks
canvas.addEventListener("click", (e) => {
  if (currentDot >= dots.length - 1) return;

  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const nextDot = dots[currentDot + 1];

  const dx = mouseX - nextDot.x;
  const dy = mouseY - nextDot.y;

  const distance = Math.sqrt(dx * dx + dy * dy);

  // Click close enough to next dot
  if (distance < 20) {
    currentDot++;

    drawDots();
    drawLines(currentDot);

    // Finished square
    if (currentDot === dots.length - 1) {
      // Connect back to start
      ctx.beginPath();
      ctx.moveTo(dots[dots.length - 1].x, dots[dots.length - 1].y);
      ctx.lineTo(dots[0].x, dots[0].y);
      ctx.stroke();

      setTimeout(() => {
        alert("Square completed!");
      }, 100);
    }
  }
});
</script>

</body>
</html>
